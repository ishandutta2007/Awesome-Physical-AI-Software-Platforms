<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Awesome Physical AI Software — SaaS platforms, robotics OS, simulation, VLA models and open-source robotics">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#141a33"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="60s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d3a8f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1d3a8f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#3d4f86" stroke-width="1"/>
    </pattern>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2ff"/>
      <stop offset="100%" stop-color="#3ee0ff"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3a6b"/>
      <stop offset="100%" stop-color="#1a2247"/>
    </linearGradient>

    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#a06bff"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2ff"/>
      <stop offset="100%" stop-color="#3ee0ff"/>
    </linearGradient>

    <mask id="titleMask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse">
      <text x="80" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="1" fill="#ffffff">Awesome Physical AI Software</text>
    </mask>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="400" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="400" fill="url(#grid)" opacity="0.08"/>

  <!-- glow orbs -->
  <circle cx="180" cy="40" r="200" fill="url(#orbA)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.55;0.3" dur="8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;50 -25;0 0" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="380" r="210" fill="url(#orbB)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-40 20;0 0" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- frame -->
  <rect x="10" y="10" width="1180" height="380" rx="18" fill="none" stroke="#2a355e" stroke-width="2" opacity="0.7"/>

  <!-- circuit nodes -->
  <g fill="#3ee0ff">
    <circle cx="72" cy="330" r="3"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="168" cy="282" r="2.5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="264" cy="338" r="3"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="344" cy="290" r="2.5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- scan line -->
  <line x1="40" y1="0" x2="1160" y2="0" stroke="#4f7cff" stroke-width="1">
    <animate attributeName="y1" values="24;376" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="24;376" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.16;0" dur="9s" repeatCount="indefinite"/>
  </line>

  <!-- rising particles -->
  <g fill="#8be9ff">
    <circle cx="130" cy="0" r="2.5" opacity="0">
      <animate attributeName="cy" values="420;10" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="0" r="3" opacity="0">
      <animate attributeName="cy" values="420;10" dur="11s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="11s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="0" r="2" opacity="0">
      <animate attributeName="cy" values="420;10" dur="8s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.65;0" dur="8s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="0" r="2.5" opacity="0">
      <animate attributeName="cy" values="420;10" dur="10s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="10s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="0" r="2" opacity="0">
      <animate attributeName="cy" values="420;10" dur="9.5s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="9.5s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- robot: pulse ring, orbit rings, waving arm, head -->
  <g>
    <circle cx="990" cy="186" r="30" fill="none" stroke="#4f7cff" stroke-width="2">
      <animate attributeName="r" values="34;128" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <g opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0 990 186" to="360 990 186" dur="18s" repeatCount="indefinite"/>
      <circle cx="990" cy="186" r="92" fill="none" stroke="#5a6bd8" stroke-width="1.5" stroke-dasharray="6 12"/>
    </g>
    <g opacity="0.25">
      <animateTransform attributeName="transform" type="rotate" from="360 990 186" to="0 990 186" dur="24s" repeatCount="indefinite"/>
      <circle cx="990" cy="186" r="112" fill="none" stroke="#3ee0ff" stroke-width="1.5" stroke-dasharray="2 14"/>
    </g>

    <!-- waving arm -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="10 920 238;-10 920 238;10 920 238" dur="3.4s" repeatCount="indefinite"/>
      <line x1="920" y1="238" x2="886" y2="288" stroke="url(#armGrad)" stroke-width="16" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="14 886 288;-14 886 288;14 886 288" dur="2.7s" repeatCount="indefinite"/>
        <line x1="886" y1="288" x2="850" y2="332" stroke="url(#armGrad)" stroke-width="13" stroke-linecap="round"/>
        <line x1="850" y1="332" x2="838" y2="356" stroke="#8be9ff" stroke-width="5" stroke-linecap="round"/>
        <line x1="850" y1="332" x2="862" y2="356" stroke="#8be9ff" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- head -->
    <rect x="918" y="162" width="14" height="30" rx="7" fill="#2a355e"/>
    <rect x="1048" y="162" width="14" height="30" rx="7" fill="#2a355e"/>
    <rect x="930" y="128" width="120" height="116" rx="28" fill="url(#headGrad)" stroke="#3d4f86" stroke-width="2"/>
    <rect x="948" y="146" width="84" height="66" rx="14" fill="#0c1124" stroke="#3d4f86" stroke-width="1.5"/>
    <ellipse cx="968" cy="179" rx="9" ry="14" fill="#8be9ff">
      <animate attributeName="ry" values="14;14;1;14;14" keyTimes="0;0.9;0.93;0.96;1" dur="4.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1012" cy="179" rx="9" ry="14" fill="#8be9ff">
      <animate attributeName="ry" values="14;14;1;14;14" keyTimes="0;0.9;0.93;0.96;1" dur="4.2s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="978" y="198" width="24" height="5" rx="2.5" fill="#ff6b9d">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <line x1="990" y1="128" x2="990" y2="100" stroke="#3d4f86" stroke-width="3"/>
    <circle cx="990" cy="94" r="5" fill="#ff6b9d">
      <animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="990" cy="220" r="4" fill="#3ee0ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- monogram -->
  <circle cx="100" cy="60" r="20" fill="none" stroke="#4f7cff" stroke-width="1.5">
    <animate attributeName="r" values="18;32;18" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <rect x="80" y="40" width="40" height="40" rx="12" fill="#121a33" stroke="#3d4f86" stroke-width="2"/>
  <text x="100" y="67" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="url(#titleGrad)">PA</text>

  <!-- title -->
  <text x="80" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="1" fill="url(#titleGrad)">Awesome Physical AI Software</text>

  <!-- shimmer sweep over the title -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-380 0" to="1380 0" dur="5.5s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="340" height="150" fill="url(#shimmer)" mask="url(#titleMask)"/>
  </g>

  <!-- breathing underline -->
  <line x1="82" y1="174" x2="82" y2="174" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round">
    <animate attributeName="x2" values="82;600;82" dur="7s" repeatCount="indefinite"/>
  </line>

  <!-- subtitle -->
  <text x="82" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500" fill="#9fb4e8">SaaS Platforms · Robotics OS · Simulation · VLA Models &amp; Open Source</text>

  <!-- category chips, staggered fade-in -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="0.3s" dur="1s" fill="freeze"/>
      <rect x="80" y="236" width="118" height="30" rx="15" fill="#131a33" stroke="#3d4f86" stroke-width="1.2"/>
      <text x="139" y="256" text-anchor="middle" fill="#8be9ff">Simulation</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="0.7s" dur="1s" fill="freeze"/>
      <rect x="212" y="236" width="124" height="30" rx="15" fill="#131a33" stroke="#3d4f86" stroke-width="1.2"/>
      <text x="274" y="256" text-anchor="middle" fill="#c8a2ff">VLA Models</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="1.1s" dur="1s" fill="freeze"/>
      <rect x="350" y="236" width="118" height="30" rx="15" fill="#131a33" stroke="#3d4f86" stroke-width="1.2"/>
      <text x="409" y="256" text-anchor="middle" fill="#7aa2ff">Fleet MLOps</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="1.5s" dur="1s" fill="freeze"/>
      <rect x="482" y="236" width="124" height="30" rx="15" fill="#131a33" stroke="#3d4f86" stroke-width="1.2"/>
      <text x="544" y="256" text-anchor="middle" fill="#3ee0ff">Open Source</text>
    </g>
  </g>
</svg>
